[package]
name = "my_api"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
